[package]
name = "necko7"
version = "0.2.3"
edition = "2024"

[dependencies]
dotenvy = "0.15"

axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
thiserror = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", features = ["chrono_0_4"] }

hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.13", features = ["json", "form", "query"] }
url = "2.5"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }

parking_lot = "0.12"

sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }

tower-http = { version = "0.7", features = ["cors"] }

serde_path_to_error = "0.1"
serde_urlencoded = "0.7"
form_urlencoded = "1"

utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

governor = "0.10"